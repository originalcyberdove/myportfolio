<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="blueCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="500" height="600" rx="24" fill="url(#bgGrad2)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Subtle grid lines -->
  <g stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="120" x2="500" y2="120" />
    <line x1="0" y1="240" x2="500" y2="240" />
    <line x1="0" y1="360" x2="500" y2="360" />
    <line x1="0" y1="480" x2="500" y2="480" />
    <line x1="125" y1="0" x2="125" y2="600" />
    <line x1="250" y1="0" x2="250" y2="600" />
    <line x1="375" y1="0" x2="375" y2="600" />
  </g>

  <!-- Technical Corner Marks -->
  <path d="M 20 50 L 20 20 L 50 20" stroke="#00e5ff" stroke-width="2.5" fill="none"/>
  <path d="M 480 50 L 480 20 L 450 20" stroke="#00e5ff" stroke-width="2.5" fill="none"/>
  <path d="M 20 550 L 20 580 L 50 580" stroke="#00e5ff" stroke-width="2.5" fill="none"/>
  <path d="M 480 550 L 480 580 L 450 580" stroke="#00e5ff" stroke-width="2.5" fill="none"/>

  <!-- Top System Header -->
  <rect x="30" y="30" width="440" height="36" rx="8" fill="#070c18" stroke="#38bdf8" stroke-opacity="0.2"/>
  <circle cx="50" cy="48" r="5" fill="#10b981"/>
  <text x="65" y="52" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="1">ID: OA-2026 // CYBERDOVE</text>
  <rect x="360" y="38" width="95" height="20" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="370" y="52" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10b981">OPERATIONAL</text>

  <!-- Stylized Silhouette / Professional Portrait Silhouette -->
  <circle cx="250" cy="220" r="110" fill="url(#avatarGrad)" stroke="#00e5ff" stroke-width="2" stroke-dasharray="4 2"/>
  
  <!-- Stylized Figure Outline -->
  <g fill="#94a3b8" fill-opacity="0.85">
    <!-- Head and shoulders silhouette -->
    <circle cx="250" cy="195" r="48" fill="#cbd5e1"/>
    <!-- Blazer / Suit collar silhouette -->
    <path d="M 175 320 C 175 255 210 250 250 250 C 290 250 325 255 325 320 Z" fill="#334155"/>
    <path d="M 250 250 L 230 320 L 270 320 Z" fill="#00e5ff" fill-opacity="0.3"/>
    <path d="M 250 270 L 250 320" stroke="#00e5ff" stroke-width="2"/>
  </g>

  <!-- Cyber Scan Reticle Overlay -->
  <circle cx="250" cy="220" r="130" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="100" y1="220" x2="400" y2="220" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="8 8"/>
  <line x1="250" y1="70" x2="250" y2="370" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="8 8"/>

  <!-- Info Card Overlay -->
  <rect x="40" y="370" width="420" height="180" rx="16" fill="#070c18" stroke="#38bdf8" stroke-opacity="0.25"/>
  
  <text x="65" y="405" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#ffffff">Oluwatomilola Arogundade</text>
  <text x="65" y="428" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#00e5ff">Cybersecurity Professional | Cyberdove</text>
  
  <!-- Badges inside card -->
  <g transform="translate(65, 445)">
    <rect x="0" y="0" width="140" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3"/>
    <text x="10" y="17" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">B.Sc. 1st Class (4.61)</text>
    
    <rect x="150" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3"/>
    <text x="160" y="17" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">SOC &amp; AppSec</text>
  </g>

  <g transform="translate(65, 482)">
    <rect x="0" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3"/>
    <text x="10" y="17" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Red Team Leaders</text>

    <rect x="140" y="0" width="150" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3"/>
    <text x="150" y="17" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Security Educator (40+)</text>
  </g>

  <text x="65" y="534" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">[ USER PHOTO CAN BE PLACED IN /media/profile/portrait.jpg ]</text>
</svg>
